name: CI - Build and Push Docker Images

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Git SHA
        id: vars
        run: echo "SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Build and Push Catalog Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            harshranjan539/catalog-service:${{ steps.vars.outputs.SHA_SHORT }}
            harshranjan539/catalog-service:latest

      - name: Build and Push Auth Image
        uses: docker/build-push-action@v5
        with:
          context: ./auth-service
          push: true
          tags: |
            harshranjan539/auth-service:${{ steps.vars.outputs.SHA_SHORT }}
            harshranjan539/auth-service:latest