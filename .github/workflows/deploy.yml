name: Deploy to EKS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region $AWS_REGION | \
          docker login --username AWS --password-stdin 253490771520.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and Push Catalog Image
        run: |
          docker build -t catalog-service ./backend
          docker tag catalog-service:latest 253490771520.dkr.ecr.ap-south-1.amazonaws.com/catalog-service:${{ github.sha }}
          docker push 253490771520.dkr.ecr.ap-south-1.amazonaws.com/catalog-service:${{ github.sha }}

      - name: Build and Push Auth Image
        run: |
          docker build -t auth-service ./auth-service
          docker tag auth-service:latest 253490771520.dkr.ecr.ap-south-1.amazonaws.com/auth-service:${{ github.sha }}
          docker push 253490771520.dkr.ecr.ap-south-1.amazonaws.com/auth-service:${{ github.sha }}
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name car-marketplace-cluster

      - name: Check if cluster reachable
        id: cluster_check
        run: |
          kubectl get nodes
        continue-on-error: true    

      - name: Deploy to EKS
        if: steps.cluster_check.outcome == 'success'
        run: |
          kubectl apply -f k8s/
          kubectl set image deployment/catalog-deployment \
            catalog-container=253490771520.dkr.ecr.ap-south-1.amazonaws.com/catalog-service:${{ github.sha }}

          kubectl set image deployment/auth-deployment \
            auth-container=253490771520.dkr.ecr.ap-south-1.amazonaws.com/auth-service:${{ github.sha }}

          kubectl rollout status deployment/catalog-deployment
          kubectl rollout status deployment/auth-deployment
