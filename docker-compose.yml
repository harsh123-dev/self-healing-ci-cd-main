version: "3.9"

services:
  backend:
    build: ./backend
    container_name: backend-service
    ports:
      - "3000:3000"
    restart: always

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "4000:4000"
    restart: always

  frontend:
    build: ./
    container_name: frontend-service
    ports:
      - "5173:5173"
    restart: always


